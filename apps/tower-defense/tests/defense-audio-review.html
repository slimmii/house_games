<!doctype html>
<html><head><meta charset="utf-8"><title>Defense audio review</title><link rel="icon" href="/favicon.svg">
<style>
  body{margin:0;padding:16px;background:#2f2a25;color:#eee;font:12px/1.3 ui-monospace,Menlo,monospace}
  h1{font-size:15px;margin:0 0 8px} h2{font-size:13px;margin:16px 0 6px}
  .buttons{display:flex;flex-wrap:wrap;gap:4px;max-width:1240px}
  button{font:inherit;background:#4a4238;color:#fff;border:1px solid #6a5f52;border-radius:4px;padding:3px 7px;cursor:pointer}
  button:hover{background:#5e5446}
  table{border-collapse:collapse;margin-top:4px} td,th{padding:1px 10px;text-align:right;border-bottom:1px solid #3d362f} td:first-child,th:first-child{text-align:left}
  .bad{color:#ff7b6b;font-weight:bold} .bar{display:inline-block;height:8px;background:#9fd27a;vertical-align:middle}
  #report{display:grid;grid-template-columns:auto auto;gap:24px;align-items:start}
</style></head><body>
<h1>Little Defenders: synthesized audio</h1>
<div>Click to audition (live context through the game's master chain and rate limiter).
  <label><input type="checkbox" id="music"> music loop</label>
  <label>speed <select id="speed"><option>1</option><option>2</option><option>3</option></select></label>
  <button id="storm">live stress (300 events / 1 s)</button></div>
<div class="buttons" id="buttons"></div>
<div id="report"><div><h2>Offline render, raw per sound</h2><table id="table"></table></div><div><h2>Stress</h2><table id="stress"></table></div></div>
<script type="module">
// Renders every sound offline and measures it; window.audioReport holds the numbers.
import { SOUND_NAMES, renderSound, createMixer, createMasterChain, createAudio } from '/src/audio.ts';

const RATE = 44100;
/** Longest audible length intended per sound (seconds); anything else defaults to 0.5. */
const LONGEST = {
  'die:vehicle': 0.5, 'die:boss': 1.2, leak: 0.8, stomp: 0.5, 'spawn:boss': 1.5, wave: 1.6, 'wave:boss': 2.1,
  waveClear: 1.2, upgrade: 0.7, sell: 0.5, 'ability:footsteps': 1.9, 'ability:marbles': 1.5, won: 3.4, lost: 3.6,
  'ui:start': 0.7, music: 17.8,
};
const QUIET = 10 ** (-60 / 20);

function measure(buffer) {
  const data = buffer.getChannelData(0);
  let peak = 0, first = -1, last = -1;
  for (let i = 0; i < data.length; i++) {
    const a = Math.abs(data[i]);
    if (a > peak) peak = a;
    if (a > QUIET) { if (first < 0) first = i; last = i; }
  }
  let sum = 0;
  for (let i = Math.max(first, 0); i <= last; i++) sum += data[i] * data[i];
  const n = Math.max(1, last - first + 1);
  return { peak: +peak.toFixed(3), rms: +Math.sqrt(sum / n).toFixed(4), audibleSeconds: first < 0 ? 0 : +((last - first) / RATE).toFixed(3) };
}

async function renderOne(name) {
  const seconds = name === 'music' ? 19 : 4;
  const ctx = new OfflineAudioContext(1, RATE * seconds, RATE);
  renderSound(ctx, ctx.destination, name, 0.01);
  return measure(await ctx.startRendering());
}

const TOWERS = ['popgun', 'dart', 'mortar', 'glue', 'ballista', 'robot'];
const KINDS = ['rifleman', 'scout', 'shield', 'jeep', 'tank', 'helicopter', 'paratrooper'];
function stressEvents() {
  const events = [];
  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < 300; i++) {
    const r = rnd(), tower = TOWERS[Math.floor(rnd() * TOWERS.length)];
    const event = r < 0.45 ? { type: 'fire', tower, x: 0, y: 0, z: 0 }
      : r < 0.85 ? { type: 'hit', tower, x: 0, y: 0, z: 0 }
      : { type: 'die', kind: KINDS[Math.floor(rnd() * KINDS.length)], tier: 0, x: 0, z: 0, altitude: 0, bounty: 5, boss: false };
    events.push({ t: 0.05 + rnd(), event });
  }
  return events.sort((a, b) => a.t - b.t);
}

async function renderStress(speed) {
  const ctx = new OfflineAudioContext(1, RATE * 2, RATE);
  const chain = createMasterChain(ctx, ctx.destination);
  const mixer = createMixer(ctx, chain.input);
  mixer.setSpeed(speed);
  for (const { t, event } of stressEvents()) mixer.handle(event, t);
  const m = measure(await ctx.startRendering());
  return { name: `stress@${speed}x`, ...m, events: 300, voices: mixer.stats.scheduled, dropped: mixer.stats.dropped, maxActive: mixer.stats.maxActive };
}

const report = [];
const table = document.getElementById('table');
table.innerHTML = '<tr><th>sound</th><th>peak</th><th>rms</th><th>seconds</th><th></th><th>flags</th></tr>';
for (const name of SOUND_NAMES) {
  const m = await renderOne(name);
  const flags = [];
  if (m.peak < 0.02) flags.push('SILENT');
  if (m.peak > 0.98) flags.push('CLIPPING');
  if (m.audibleSeconds > (LONGEST[name] ?? 0.5)) flags.push('LONG');
  report.push({ name, ...m, ...(flags.length ? { flags: flags.join(' ') } : {}) });
  table.insertAdjacentHTML('beforeend', `<tr><td>${name}</td><td>${m.peak}</td><td>${m.rms}</td><td>${m.audibleSeconds}</td>
    <td><span class="bar" style="width:${Math.round(m.peak * 120)}px"></span></td><td class="bad">${flags.join(' ')}</td></tr>`);
}
const stress = document.getElementById('stress');
stress.innerHTML = '<tr><th>case</th><th>peak</th><th>rms</th><th>voices</th><th>dropped</th><th>max active</th><th>flags</th></tr>';
for (const speed of [1, 3]) {
  const s = await renderStress(speed);
  const flags = [s.peak > 0.98 ? 'CLIPPING' : '', s.maxActive > 24 ? 'OVER CAP' : '', s.peak < 0.02 ? 'SILENT' : ''].filter(Boolean).join(' ');
  if (flags) s.flags = flags;
  report.push(s);
  stress.insertAdjacentHTML('beforeend', `<tr><td>${s.name}</td><td>${s.peak}</td><td>${s.rms}</td><td>${s.voices}</td><td>${s.dropped}</td><td>${s.maxActive}</td><td class="bad">${flags}</td></tr>`);
}
window.audioReport = report;

// Live audition through the real game audio object.
const audio = createAudio();
const ctxless = { x: 0, y: 0, z: 0 };
const EVENTS = {
  'spawn:boss': { type: 'spawn', kind: 'colonel', boss: true },
  burst: { type: 'burst', x: 0, z: 0, radius: 1 }, puddle: { type: 'puddle', x: 0, z: 0, radius: 1 },
  'die:soldier': { type: 'die', kind: 'rifleman', tier: 0, x: 0, z: 0, altitude: 0, bounty: 5, boss: false },
  'die:vehicle': { type: 'die', kind: 'tank', tier: 0, x: 0, z: 0, altitude: 0, bounty: 45, boss: false },
  'die:boss': { type: 'die', kind: 'colonel', tier: 0, x: 0, z: 0, altitude: 0, bounty: 250, boss: true },
  leak: { type: 'leak', kind: 'rifleman', lives: 1 }, land: { type: 'land', x: 0, z: 0 }, stomp: { type: 'stomp', x: 0, z: 0, radius: 2 },
  wave: { type: 'wave', number: 3, boss: false }, 'wave:boss': { type: 'wave', number: 10, boss: true },
  waveClear: { type: 'waveClear', number: 3, bonus: 50 }, build: { type: 'build', tower: 'popgun', ...ctxless },
  upgrade: { type: 'upgrade', tower: 'popgun', ...ctxless }, sell: { type: 'sell', refund: 10, ...ctxless },
  'ability:footsteps': { type: 'ability', kind: 'footsteps', x: 0, z: 0 }, 'ability:marbles': { type: 'ability', kind: 'marbles', x: 0, z: 0 },
  won: { type: 'won' }, lost: { type: 'lost' },
};
function eventFor(name) {
  const [kind, sub] = name.split(':');
  if (kind === 'fire' || kind === 'hit') return { type: kind, tower: sub, ...ctxless };
  return EVENTS[name];
}
const buttons = document.getElementById('buttons');
for (const name of SOUND_NAMES) {
  if (name === 'music') continue;
  const button = document.createElement('button');
  button.textContent = name;
  button.onclick = () => {
    audio.unlock();
    if (name.startsWith('ui:')) audio.ui(name.slice(3));
    else audio.handle(eventFor(name));
  };
  buttons.append(button);
}
document.getElementById('music').onchange = event => { audio.unlock(); audio.setMusic(event.target.checked); };
document.getElementById('speed').onchange = event => audio.setSpeed(Number(event.target.value));
document.getElementById('storm').onclick = () => {
  audio.unlock();
  const start = performance.now();
  for (const { t, event } of stressEvents()) setTimeout(() => audio.handle(event), t * 1000);
  console.log('stress scheduled', performance.now() - start);
};
document.body.dataset.ready = 'true';
</script>
</body></html>
