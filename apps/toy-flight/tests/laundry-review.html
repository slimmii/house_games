<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Laundry review</title><style>body{margin:0}canvas{display:block}#label{position:fixed;top:15px;left:20px;padding:10px;background:white;font:16px system-ui}</style></head><body><div id="label">Loading laundry…</div><script type="module">
import * as THREE from 'three';import {createHouse} from '@huis/house/client/world';import {DOORS,createDoorStates} from '@huis/house/shared/doors';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,900);renderer.setPixelRatio(1);renderer.toneMapping=THREE.AgXToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(52,1280/900,.03,100);camera.position.set(7.0,3.1,-25.88);camera.lookAt(2.8,2.35,-25.88);
const house=createHouse(scene,renderer);await house.ready;const states=createDoorStates();let running=true,last=performance.now();
function show(fraction){for(const id of ['laundry-washer','laundry-dryer']){const index=DOORS.findIndex(d=>d.id===id);states[index]={fraction,opening:fraction>0};}house.updateDoors(states);document.getElementById('label').textContent=`Left: washing machine · Right: dryer · ${fraction?'doors open / drums stopped':'doors closed / drums turning'}`;renderer.render(scene,camera);return {removed:scene.getObjectByName('operable-laundry').userData.removedSourceParts,rotations:['laundry-washer','laundry-dryer'].map(id=>scene.getObjectByName(`${id}:rotor`).rotation.x)};}
function frame(now){house.updateDoors(states,Math.min(.05,(now-last)/1000));last=now;renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);window.laundryReview={show};show(0);window.reviewReady=true;
</script></body></html>
